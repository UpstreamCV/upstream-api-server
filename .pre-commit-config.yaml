# Runs ruff (the SAME version as uv.lock / CI, via `uv run`) on staged files at
# commit time, so unformatted or lint-broken Python can't be committed — that
# formatting drift is what keeps turning CI red on push. One-time setup:
#
#     uv add --dev pre-commit && uv run pre-commit install
#
# Full CI parity (mypy on src+tests, plus pytest under CI's env) lives in
# `make ci` — run that before pushing.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check (--fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
