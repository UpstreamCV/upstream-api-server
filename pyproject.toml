[project]
name = "upstream-api"
version = "0.1.0"
description = "Upstream API control plane — auth, accounts, sessions, metadata"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "supabase>=2.7",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "structlog>=24",
    "python-json-logger>=2.0",
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    "gunicorn>=23",
    "uvicorn[standard]>=0.30",
    "cachetools>=5.5",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "faker>=30",
    "types-cachetools>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstream_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "ASYNC", "C4", "UP", "RUF", "SIM"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is idiomatic
    "N818",  # exception names without "Error" suffix are fine for our API codes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["supabase.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
