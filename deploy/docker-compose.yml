name: upstream-api

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: upstream-api:latest
    restart: always
    env_file: .env
    expose:
      - "4000"
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: upstream-caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
